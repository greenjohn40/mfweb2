function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(x) {
    if (typeof x !== 'number') return x;
    if (Number.isInteger(x)) return x.toString();
    return x.toFixed(2).replace(/\.?0+$/, '').replace('.', '{,}');
}
function tex(x) { return '$' + fmt(x) + '$'; }
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function buildOptions(correct, extras, spread) {
    const set = new Set([tex(correct)]);
    extras.filter(x => Number.isInteger(x) && x > 0).forEach(x => { if (set.size < 4) set.add(tex(x)); });
    let guard = 0;
    while (set.size < 4 && guard < 200) {
        const delta = randInt(1, spread) * (Math.random() < 0.5 ? 1 : -1);
        const candidate = correct + delta;
        if (candidate > 0) set.add(tex(candidate));
        guard++;
    }
    return [...set];
}

function fillTemplate(text, dict) {
    return text.replace(/\{(\w+)\}/g, (_, k) => (typeof dict[k] === 'number' ? fmt(dict[k]) : dict[k]));
}

function prepareQuestion(template, lang) {
    const other = lang === 'cs' ? 'fr' : 'cs';
    let q = JSON.parse(JSON.stringify(template[lang]));
    let tr = JSON.parse(JSON.stringify(template[other]));

    if (template.type === 'math') {
        const p = template.params();
        const sol = template.solve(p);
        if (template.category) {
            const dictCs = Object.assign({}, p, { expl: sol.explCs });
            const dictFr = Object.assign({}, p, { expl: sol.explFr });
            const dict = { cs: dictCs, fr: dictFr };
            const opts = { cs: template.optionsCs, fr: template.optionsFr };
            q.q = fillTemplate(template[lang].q, dict[lang]);
            q.e = fillTemplate(template[lang].e, dict[lang]);
            q.o = [...opts[lang]];
            q.a = opts[lang][sol.idx];
            tr.q = fillTemplate(template[other].q, dict[other]);
            tr.e = fillTemplate(template[other].e, dict[other]);
            tr.o = [...opts[other]];
            tr.a = opts[other][sol.idx];
        } else {
            const options = template.wrongOptions(p, sol);
            const dict = Object.assign({}, p, sol);
            [q, tr].forEach(obj => {
                obj.q = fillTemplate(obj.q, dict);
                obj.e = fillTemplate(obj.e, dict);
                obj.a = sol.correct;
                obj.o = [...options];
            });
        }
    }

    // jedno sdilene promichani poradi moznosti pro obe jazykove verze
    const order = shuffleArray([...Array(q.o.length).keys()]);
    q.o = order.map(i => q.o[i]);
    tr.o = order.map(i => tr.o[i]);

    return Object.assign({}, q, { type: template.type, lang: lang, translation: tr, id: template.id });
}

function generateBalancedQuiz() {
    const sTheory = shuffleArray([...theoryPool]);
    const sMath = shuffleArray([...mathPool]);

    const selected = [];
    for (let i = 0; i < N_THEORY; i++) {
        selected.push(prepareQuestion(sTheory[i % sTheory.length], i % 2 === 0 ? 'fr' : 'cs'));
    }
    for (let i = 0; i < N_MATH; i++) {
        selected.push(prepareQuestion(sMath[i % sMath.length], i % 2 === 0 ? 'cs' : 'fr'));
    }
    return shuffleArray(selected);
}

            document.getElementById('score-text').textContent = 'Body: 0';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function showQuestion() {
            const q = sessionQuestions[currentQuestionIndex];
            isTranslated = false;
            answeredIndex = null;
            answeredCorrect = null;

            const transBtn = document.getElementById('translate-btn');
            if (q.lang === 'cs') {
                transBtn.classList.add('hidden-el');
            } else {
                transBtn.classList.remove('hidden-el');
            }

            document.getElementById('lang-tag').textContent = q.lang === 'cs' ? '🇨🇿 CZ' : '🇫🇷 FR';
            document.getElementById('type-tag').textContent = q.type === 'math' ? 'Úloha' : 'Teorie';
            document.getElementById('progress-text').textContent = `Otázka ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;

            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback-area').classList.add('hidden');

            renderContent();
        }

        function renderContent() {
            const q = sessionQuestions[currentQuestionIndex];
            const data = isTranslated ? q.translation : q;

            document.getElementById('question-title').innerHTML = data.q;
            document.getElementById('question-title').className = isTranslated ? "text-xl font-bold leading-snug text-violet-700" : "text-xl font-bold leading-snug text-slate-900";

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            data.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 border-2 border-slate-200 rounded-xl hover:bg-slate-50 hover:border-violet-300 font-medium fade-in";
                btn.innerHTML = opt;
                btn.dataset.optText = opt;
                btn.dataset.idx = idx;
                if (answeredIndex !== null) {
                    btn.disabled = true;
                    if (opt === data.a) btn.classList.add('correct');
                    else if (idx === answeredIndex) btn.classList.add('wrong');
                } else {
                    btn.onclick = () => checkAnswer(btn, idx);
                }
                grid.appendChild(btn);
            });

            if (!document.getElementById('hint-box').classList.contains('hidden')) {
                document.getElementById('hint-box').innerHTML = data.h;
            }
            if (answeredIndex !== null) {
                document.getElementById('feedback-explanation').innerHTML = data.e;
            }

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('question-title'), document.getElementById('options-grid'), document.getElementById('hint-box'), document.getElementById('feedback-explanation')]).catch(err => console.warn('MathJax error:', err));
            }
        }

        function toggleTranslation() {
            if (!isTranslated) translationUsedCount++;
            isTranslated = !isTranslated;
            renderContent();
        }

        function showHint() {
            hintUsedCount++;
            const q = sessionQuestions[currentQuestionIndex];
            const data = isTranslated ? q.translation : q;
            const hb = document.getElementById('hint-box');
            hb.innerHTML = data.h;
            hb.classList.remove('hidden');
            document.getElementById('hint-btn').classList.add('hidden');
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([hb]).catch(err => console.warn('MathJax error:', err));
            }
        }

        function checkAnswer(btn, idx) {
            if (answeredIndex !== null) return;
            const q = sessionQuestions[currentQuestionIndex];
            const data = isTranslated ? q.translation : q;
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const selected = data.o[idx];
            const isCorrect = (selected === data.a);
            answeredIndex = idx;
            answeredCorrect = isCorrect;
            if (isCorrect) { btn.classList.add('correct'); score++; }
            else {
                btn.classList.add('wrong');
                allBtns.forEach(b => { if (b.dataset.optText === data.a) b.classList.add('correct'); });
            }

            document.getElementById('feedback-status').textContent = isCorrect ? "Správně!" : "Chyba";
            document.getElementById('feedback-status').className = isCorrect ? "font-bold text-emerald-600" : "font-bold text-red-600";
            document.getElementById('feedback-explanation').innerHTML = data.e;

            const fa = document.getElementById('feedback-area');
            fa.className = `mt-6 p-4 rounded-xl border-2 fade-in ${isCorrect ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'}`;
            fa.classList.remove('hidden');

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('feedback-explanation')]).catch(err => console.warn('MathJax error:', err));
            }

            userAnswers.push({ type: q.type, correct: isCorrect, id: q.id });
            document.getElementById('score-text').textContent = `Body: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) showQuestion(); else finishQuiz();
        }

        function finishQuiz() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const p = Math.round((score / TOTAL_QUESTIONS) * 100);
            document.getElementById('final-score').textContent = `${p}%`;
            document.getElementById('final-grade').textContent = `Známka: ${p >= 85 ? "1" : p >= 70 ? "2" : p >= 50 ? "3" : p >= 30 ? "4" : "5"}`;
            generateOwnAnalysis(p);
        }

        function generateOwnAnalysis(percent) {
            const stats = userAnswers.reduce((acc, curr) => {
                acc[curr.type].total++;
                if (curr.correct) acc[curr.type].correct++;
                return acc;
            }, { concept: { total: 0, correct: 0 }, math: { total: 0, correct: 0 } });

            const theoryCorrect = stats.concept.correct;
            const theoryTotal = stats.concept.total;
            const mathCorrect = stats.math.correct;
            const mathTotal = stats.math.total;
            const theoryPercent = theoryTotal > 0 ? Math.round((theoryCorrect / theoryTotal) * 100) : 0;
            const mathPercent = mathTotal > 0 ? Math.round((mathCorrect / mathTotal) * 100) : 0;

            const wrongIds = userAnswers.filter(a => !a.correct).map(a => a.id);
            const posWrong = wrongIds.some(id => ['m2', 'm6', 't1', 't2', 't3', 't4', 't5'].includes(id));
            const constrWrong = wrongIds.some(id => ['m1', 'm3', 'm4', 'm5', 't6', 't7', 't8'].includes(id));

            let overallMsg, overallIcon;
            if (percent >= 85) { overallMsg = "Výborně! Vzájemné polohy přímek a rovin i konstrukce řezů ti jdou skvěle, a to i francouzsky."; overallIcon = "🏆"; }
            else if (percent >= 70) { overallMsg = "Dobrá práce! Máš solidní prostorovou představivost, ale ještě je co zlepšovat."; overallIcon = "💪"; }
            else if (percent >= 50) { overallMsg = "Základní přehled máš, ale doporučuji si zopakovat kritéria rovnoběžnosti a postup při konstrukci řezu."; overallIcon = "📚"; }
            else { overallMsg = "Je potřeba více trénovat – začni rozlišováním různoběžek, rovnoběžek a mimoběžek v krychli a metodou pomocné roviny."; overallIcon = "🔍"; }

            let strengths = [], weaknesses = [];
            if (theoryPercent >= 70) strengths.push("Teorii zvládáš dobře – rozumíš pojmům jako mimoběžky, kritérium rovnoběžnosti či metoda pomocné roviny.");
            else weaknesses.push("Teorie ti dělá potíže – zopakuj si definice vzájemných poloh a kritéria rovnoběžnosti.");
            if (mathPercent >= 70) strengths.push("Úlohy na polohu a řezy v krychli i jehlanu ti jdou velmi dobře!");
            else weaknesses.push("V úlohách chybuješ – procvič si určování vzájemné polohy v krychli a výpočty délek při konstrukci řezů.");
            if (posWrong && !constrWrong) weaknesses.push("Chyby se týkaly hlavně vzájemné polohy přímek a rovin (části A a B).");
            if (constrWrong && !posWrong) weaknesses.push("Chyby se týkaly hlavně polohových úloh – průsečíků a řezů (část C).");
            if (theoryPercent < 70 && mathPercent < 70) weaknesses.push("Celkově je potřeba zopakovat základní pojmy z této kapitoly.");

            let recommendations = [];
            if (weaknesses.length > 0) {
                recommendations.push("Projdi si v teorii krokové konstrukce řezů a vyzkoušej si nástroj na řezy krychle; pak se vrať k řešeným úlohám.");
            } else {
                recommendations.push("Skvělá práce! Kapitolu o polohových vlastnostech a řezech máš zvládnutou – můžeš si test zopakovat s jinými zadáními a pak pokračovat kapitolou Stereometrie 3 – Metrické úlohy.");
            }
            if (percent < 50) recommendations.push("Doporučuji použít kartičky k procvičení pojmů a vět.");

            let frenchMsg, frenchIcon;
            if (translationUsedCount <= 1) { frenchMsg = "Skvěle rozumíš francouzským zadáním – překlad jsi použil/a jen výjimečně."; frenchIcon = "🇫🇷"; }
            else if (translationUsedCount <= 3) { frenchMsg = "Francouzština ti dělá mírné potíže – zkus si zvykat na termíny jako droites non coplanaires, plan auxiliaire nebo section."; frenchIcon = "📖"; }
            else { frenchMsg = "Hodně jsi spoléhal/a na překlad. Zkus si nejprve přečíst francouzské zadání a teprve pak přeložit."; frenchIcon = "🔁"; }

            const analysisItems = [
                { icon: overallIcon, title: "Celkové hodnocení", desc: overallMsg },
                { icon: "📊", title: "Teorie vs. úlohy", desc: `Teorie: ${theoryCorrect}/${theoryTotal} (${theoryPercent}%) – Úlohy: ${mathCorrect}/${mathTotal} (${mathPercent}%)` },
                { icon: "🎯", title: "Silné stránky", desc: strengths.length ? strengths.join(" ") : "Zatím nejsou zřetelné – zaměř se na systematické procvičování." },
                { icon: "⚠️", title: "Slabé stránky", desc: weaknesses.length ? weaknesses.join(" ") : "Žádné výrazné slabiny – skvělá práce!" },
                { icon: "💡", title: "Doporučení", desc: recommendations.join(" ") },
                { icon: frenchIcon, title: "Práce s francouzštinou", desc: `${frenchMsg} (překlad použit ${translationUsedCount}x)` },
                { icon: "🧠", title: "Použití nápověd", desc: `Nápovědu jsi využil/a ${hintUsedCount}x. ${hintUsedCount > 3 ? "Zkus se více spolehnout na vlastní úvahu." : "Dobře, že jsi nápovědu používal/a uvážlivě."}` }
            ];

            document.getElementById('ai-analysis').innerHTML = analysisItems.map(item => `
                <div class="flex items-start gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200 fade-in">
                    <span class="text-2xl">${item.icon}</span>
                    <div>
                        <h4 class="font-bold text-sm text-slate-800">${item.title}</h4>
                        <p class="text-xs text-slate-600 leading-relaxed">${item.desc}</p>
                    </div>
                </div>
            `).join('');
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('ai-analysis')]).catch(err => console.warn('MathJax error:', err));
            }
        }

    </script>
