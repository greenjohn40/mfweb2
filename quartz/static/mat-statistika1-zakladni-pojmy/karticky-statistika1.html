<body class="bg-slate-100 min-h-screen flex flex-col">

            </div>
            <span class="w-16"></span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">

        <div class="flex gap-4 mb-8">
            <button id="lang-cs" class="px-4 py-2 bg-white rounded-full shadow-sm border-2 border-violet-700 text-violet-700 font-bold hover:bg-violet-50 transition-colors">Čeština</button>

                    <p id="answer-text"></p>
                </div>
            </div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-4">

    </main>

    <footer class="p-6 text-center text-slate-400 text-xs">

    </footer>

    <script>

    ],
    "fr": [
        { "q": "Qu'est-ce qu'une population statistique ?", "a": "l'ensemble de toutes les unités étudiées" },
        { "q": "Qu'est-ce qu'une unité statistique ?", "a": "un élément concret de la population statistique" },
        { "q": "Qu'indique la taille de la population $n$ ?", "a": "le nombre total d'unités de la population" },

        { "q": "Qu'est-ce qu'un caractère quantitatif continu ?", "a": "un caractère pouvant prendre n'importe quelle valeur d'un intervalle" },
        { "q": "Donne un exemple de caractère quantitatif continu.", "a": "la taille, le temps, la masse" },
        { "q": "Quelles valeurs peut prendre le nombre de frères et sœurs ?", "a": "$0,1,2,3,\\dots$ (entiers non négatifs)" },
        { "q": "Que note-t-on $x_i$ ?", "a": "la valeur que prend le caractère chez une unité donnée" },
        { "q": "Qu'indique l'effectif absolu $n_i$ ?", "a": "le nombre d'unités ayant une valeur du caractère égale à $x_i$" },

        { "q": "À quoi est égale la somme de toutes les fréquences relatives ?", "a": "à $1$ (soit $100\\%$)" },
        { "q": "Chez 18 élèves, 5 d'entre eux ont 0 frère ou sœur. Quelle est la fréquence relative ?", "a": "$\\frac{5}{18}\\approx27{,}8\\%$" },

        { "q": "Pour quel type de caractère l'effectif cumulé a-t-il un sens ?", "a": "seulement pour un caractère quantitatif (où l'ordre des valeurs est pertinent)" },

        { "q": "Quelle forme avait la répartition des chiots en 5 classes ($3,6,14,6,1$) ?", "a": "en cloche (maximum au milieu, diminution vers les extrémités)" },

        { "q": "Établissement A : 6 échecs sur 40. Établissement B : 15 sur 150. Lequel est relativement plus performant ?", "a": "l'établissement B ($10\\%$ contre $15\\%$ pour l'établissement A)" },
        { "q": "Quelle est la cause la plus fréquente d'une impression trompeuse dans un diagramme en barres ?", "a": "un axe des ordonnées tronqué (ne commençant pas à zéro)" }

};

        let currentLang = 'cs';
        let currentIndex = 0;
        let order = [];

        const card = document.getElementById('card');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const counter = document.getElementById('counter');
        const nextBtn = document.getElementById('next');
        const prevBtn = document.getElementById('prev');
        const btnCs = document.getElementById('lang-cs');
        const btnFr = document.getElementById('lang-fr');
        const shuffleBtn = document.getElementById('shuffle');

        function generateOrder() {
            let arr = Array.from({length: 50}, (_, i) => i);
            let curr = arr.length, rand;
            while (curr != 0) {
                rand = Math.floor(Math.random() * curr);
                curr--;
                [arr[curr], arr[rand]] = [arr[rand], arr[curr]];
            }
            order = arr;
            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            card.classList.remove('card-flipped');
            const originalIndex = order[currentIndex];
            const data = rawData[currentLang][originalIndex];
            qText.innerHTML = data.q;
            aText.innerHTML = data.a;
            counter.textContent = `${currentLang === 'cs' ? 'Karta' : 'Carte'}: ${currentIndex + 1} / 50`;
            prevBtn.disabled = currentIndex === 0;
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([qText, aText]).catch(err => console.warn('MathJax error:', err));
            }
        }

        card.addEventListener('click', () => {
            card.classList.toggle('card-flipped');
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % 50;
            updateCard();
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        btnCs.addEventListener('click', () => {
            currentLang = 'cs';
            btnCs.classList.add('border-violet-700', 'text-violet-700');
            btnCs.classList.remove('border-transparent', 'text-slate-600');
            btnFr.classList.remove('border-violet-700', 'text-violet-700');
            btnFr.classList.add('border-transparent', 'text-slate-600');
            updateCard();
        });

        btnFr.addEventListener('click', () => {
            currentLang = 'fr';
            btnFr.classList.add('border-violet-700', 'text-violet-700');
            btnFr.classList.remove('border-transparent', 'text-slate-600');
            btnCs.classList.remove('border-violet-700', 'text-violet-700');
            btnCs.classList.add('border-transparent', 'text-slate-600');
            updateCard();
        });

        shuffleBtn.addEventListener('click', generateOrder);

        generateOrder();
    </script>

</body>
</html>
