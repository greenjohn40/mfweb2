<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards: Teplota / La température</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <style>
        .perspective { perspective: 1000px; }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
        }
        .card-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
            padding: 2rem; border-radius: 1rem; text-align: center;
        }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-orange-700 text-white p-6 shadow-md text-center">
        <h1 class="text-2xl font-bold">Flashcards: Teplota / La température</h1>
        <p class="text-orange-100 text-sm mt-1">Interaktivní porovnávání jazyků (synchronizované pořadí)</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">

        <div class="flex gap-4 mb-8">
            <button id="lang-cs" class="px-4 py-2 bg-white rounded-full shadow-sm border-2 border-orange-600 text-orange-600 font-bold hover:bg-orange-50 transition-colors">Čeština</button>
            <button id="lang-fr" class="px-4 py-2 bg-white rounded-full shadow-sm border-2 border-transparent text-slate-600 hover:bg-slate-50 transition-colors">Français</button>
        </div>

        <div class="w-full max-w-md aspect-[4/3] perspective">
            <div id="card" class="card-inner h-full shadow-xl">
                <div class="card-face card-front bg-white border-4 border-orange-500 text-xl font-semibold text-slate-800">
                    <p id="question-text">Kdy mají dvě tělesa v kontaktu stejnou teplotu?</p>
                </div>
                <div class="card-face card-back bg-orange-50 border-4 border-emerald-500 text-lg text-slate-700">
                    <p id="answer-text">Jsou-li v rovnovážném stavu.</p>
                </div>
            </div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-4">
            <div class="flex gap-4">
                <button id="prev" class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 disabled:opacity-30" disabled="">← Předchozí</button>
                <button id="next" class="px-6 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-500 font-bold">Další →</button>
            </div>
            <p id="counter" class="text-slate-500 font-mono text-sm">Karta: 1 / 50</p>
            <button id="shuffle" class="text-orange-600 text-sm hover:underline mt-2">Nové zamíchání (reset)</button>
        </div>

    </main>

    <footer class="p-6 text-center text-slate-400 text-xs">
        © Guide d'étude interactif - Fyzika / Physique
    </footer>

    <script>
        // ========== DATA ==========
        const rawData = {
            cs: [
                { q: "Kdy mají dvě tělesa v kontaktu stejnou teplotu?", a: "Jsou-li v rovnovážném stavu." },
                { q: "Co je teploměr?", a: "Přístroj k měření teploty." },
                { q: "Na čem je založena funkce rtuťového teploměru?", a: "Na roztažnosti kapaliny (rtuti) s teplotou." },
                { q: "Na čem je založena funkce bimetalového teploměru?", a: "Na různé teplotní roztažnosti dvou spojených kovů." },
                { q: "Na čem je založen optický pyrometr?", a: "Na změně barvy žhnoucího tělesa s teplotou." },
                { q: "Kolik pevných bodů potřebuje libovolná teplotní stupnice?", a: "Dva pevné body." },
                { q: "Kdo navrhl Celsiovu stupnici a kdy?", a: "Anders Celsius, v roce 1742." },
                { q: "Jaké dva body definují Celsiovu stupnici?", a: "0 °C (tuhnutí vody) a 100 °C (var vody)." },
                { q: "Kdo zavedl Fahrenheitovu stupnici a kdy?", a: "Gabriel Daniel Fahrenheit, v roce 1724." },
                { q: "Jaké dva body definují Fahrenheitovu stupnici?", a: "32 °F (tuhnutí vody) a 212 °F (var vody)." },
                { q: "Kdo zavedl termodynamickou (Kelvinovu) stupnici?", a: "William Thomson, lord Kelvin." },
                { q: "Co je 0 K?", a: "Teoreticky nejnižší možná teplota – absolutní nula." },
                { q: "Co je trojný bod vody?", a: "Teplota (273,16 K), při níž voda existuje v rovnováze jako kapalina, pevná látka i plyn." },
                { q: "Jak souvisí interval 1 K s intervalem 1 °C?", a: "Jsou si rovny (stejně velké)." },
                { q: "Jaká teplota odpovídá absolutní nule ve stupních Celsia?", a: "-273,15 °C." },
                { q: "Při jaké teplotě se Celsiova a Fahrenheitova stupnice číselně shodují?", a: "Při -40 (-40 °C = -40 °F)." },
                { q: "Jak se určuje absolutní nula z grafu V–T plynu?", a: "Extrapolací izobar k nulovému objemu." },
                { q: "Proč při výpočtu rozdílu teplot ve °F nesmíme přičítat 32?", a: "Protože posun +32 se při odečítání dvou teplot navzájem vyruší." },
                { q: "Jak velký je rozdíl 1 K vyjádřený ve stupních Fahrenheita?", a: "1,8 °F." },
                { q: "Převeďte: 0 °C na °F.", a: "32 °F." },
                { q: "Převeďte: 100 °C na °F.", a: "212 °F." },
                { q: "Převeďte: 20 °C na °F.", a: "68 °F." },
                { q: "Převeďte: 37 °C (tělesná teplota) na °F.", a: "98,6 °F." },
                { q: "Převeďte: -10 °C na °F.", a: "14 °F." },
                { q: "Převeďte: 25 °C na °F.", a: "77 °F." },
                { q: "Převeďte: 50 °C na °F.", a: "122 °F." },
                { q: "Převeďte: -30 °C na °F.", a: "-22 °F." },
                { q: "Převeďte: 32 °F na °C.", a: "0 °C." },
                { q: "Převeďte: 212 °F na °C.", a: "100 °C." },
                { q: "Převeďte: 68 °F na °C.", a: "20 °C." },
                { q: "Převeďte: 104 °F na °C.", a: "40 °C." },
                { q: "Převeďte: -4 °F na °C.", a: "-20 °C." },
                { q: "Převeďte: 50 °F na °C.", a: "10 °C." },
                { q: "Převeďte: 98,6 °F na °C.", a: "37 °C." },
                { q: "Převeďte: 0 °C na K.", a: "273,15 K." },
                { q: "Převeďte: 100 °C na K.", a: "373,15 K." },
                { q: "Převeďte: 25 °C na K.", a: "298,15 K." },
                { q: "Převeďte: -20 °C na K.", a: "253,15 K." },
                { q: "Převeďte: 37 °C na K.", a: "310,15 K." },
                { q: "Převeďte: 273,15 K na °C.", a: "0 °C." },
                { q: "Převeďte: 300 K na °C.", a: "26,85 °C." },
                { q: "Převeďte: 373,15 K na °C.", a: "100 °C." },
                { q: "Převeďte: 0 K na °C.", a: "-273,15 °C." },
                { q: "Převeďte: 250 K na °C.", a: "-23,15 °C." },
                { q: "Teplotní rozdíl ΔT = 10 °C – kolik je to v kelvinech?", a: "10 K." },
                { q: "Teplotní rozdíl Δt = 10 °C – kolik je to ve stupních Fahrenheita?", a: "18 °F." },
                { q: "Teplotní rozdíl Δt = 18 °F – kolik je to ve stupních Celsia?", a: "10 °C." },
                { q: "Teplotní rozdíl ΔT = 100 K – kolik je to ve stupních Celsia?", a: "100 °C." },
                { q: "Teplotní rozdíl Δt = 36 °F – kolik je to v kelvinech?", a: "20 K." },
                { q: "Voda ohřátá z t₁ = 10 °C na t₂ = 100 °F – jaký je nárůst teploty v kelvinech (přibližně)?", a: "Přibližně 27,8 K." }
            ],
            fr: [
                { q: "Quand deux corps en contact ont-ils la même température ?", a: "Lorsqu'ils sont en état d'équilibre." },
                { q: "Qu'est-ce qu'un thermomètre ?", a: "Un instrument permettant de mesurer la température." },
                { q: "Sur quoi repose le fonctionnement d'un thermomètre à mercure ?", a: "Sur la dilatation du liquide (mercure) avec la température." },
                { q: "Sur quoi repose le fonctionnement d'un thermomètre bimétallique ?", a: "Sur la dilatation thermique différente de deux métaux assemblés." },
                { q: "Sur quoi repose un pyromètre optique ?", a: "Sur le changement de couleur d'un corps incandescent avec la température." },
                { q: "Combien de points fixes faut-il pour définir une échelle de température ?", a: "Deux points fixes." },
                { q: "Qui a proposé l'échelle Celsius, et quand ?", a: "Anders Celsius, en 1742." },
                { q: "Quels sont les deux points définissant l'échelle Celsius ?", a: "0 °C (solidification de l'eau) et 100 °C (ébullition de l'eau)." },
                { q: "Qui a introduit l'échelle Fahrenheit, et quand ?", a: "Gabriel Daniel Fahrenheit, en 1724." },
                { q: "Quels sont les deux points définissant l'échelle Fahrenheit ?", a: "32 °F (solidification de l'eau) et 212 °F (ébullition de l'eau)." },
                { q: "Qui a introduit l'échelle thermodynamique (Kelvin) ?", a: "William Thomson, lord Kelvin." },
                { q: "Qu'est-ce que 0 K ?", a: "La température théoriquement la plus basse possible – le zéro absolu." },
                { q: "Qu'est-ce que le point triple de l'eau ?", a: "La température (273,16 K) à laquelle l'eau existe en équilibre à l'état liquide, solide et gazeux." },
                { q: "Quel est le rapport entre l'intervalle 1 K et l'intervalle 1 °C ?", a: "Ils sont égaux (de même taille)." },
                { q: "Quelle température correspond au zéro absolu en degrés Celsius ?", a: "-273,15 °C." },
                { q: "À quelle température les échelles Celsius et Fahrenheit coïncident-elles numériquement ?", a: "À -40 (-40 °C = -40 °F)." },
                { q: "Comment détermine-t-on le zéro absolu à partir du graphique V–T d'un gaz ?", a: "Par extrapolation des isobares jusqu'à un volume nul." },
                { q: "Pourquoi ne faut-il pas ajouter 32 lors du calcul d'une différence de température en °F ?", a: "Car le décalage +32 s'annule lors de la soustraction de deux températures." },
                { q: "À combien de degrés Fahrenheit correspond une différence de 1 K ?", a: "1,8 °F." },
                { q: "Convertissez : 0 °C en °F.", a: "32 °F." },
                { q: "Convertissez : 100 °C en °F.", a: "212 °F." },
                { q: "Convertissez : 20 °C en °F.", a: "68 °F." },
                { q: "Convertissez : 37 °C (température corporelle) en °F.", a: "98,6 °F." },
                { q: "Convertissez : -10 °C en °F.", a: "14 °F." },
                { q: "Convertissez : 25 °C en °F.", a: "77 °F." },
                { q: "Convertissez : 50 °C en °F.", a: "122 °F." },
                { q: "Convertissez : -30 °C en °F.", a: "-22 °F." },
                { q: "Convertissez : 32 °F en °C.", a: "0 °C." },
                { q: "Convertissez : 212 °F en °C.", a: "100 °C." },
                { q: "Convertissez : 68 °F en °C.", a: "20 °C." },
                { q: "Convertissez : 104 °F en °C.", a: "40 °C." },
                { q: "Convertissez : -4 °F en °C.", a: "-20 °C." },
                { q: "Convertissez : 50 °F en °C.", a: "10 °C." },
                { q: "Convertissez : 98,6 °F en °C.", a: "37 °C." },
                { q: "Convertissez : 0 °C en K.", a: "273,15 K." },
                { q: "Convertissez : 100 °C en K.", a: "373,15 K." },
                { q: "Convertissez : 25 °C en K.", a: "298,15 K." },
                { q: "Convertissez : -20 °C en K.", a: "253,15 K." },
                { q: "Convertissez : 37 °C en K.", a: "310,15 K." },
                { q: "Convertissez : 273,15 K en °C.", a: "0 °C." },
                { q: "Convertissez : 300 K en °C.", a: "26,85 °C." },
                { q: "Convertissez : 373,15 K en °C.", a: "100 °C." },
                { q: "Convertissez : 0 K en °C.", a: "-273,15 °C." },
                { q: "Convertissez : 250 K en °C.", a: "-23,15 °C." },
                { q: "Différence de température ΔT = 10 °C – combien cela fait-il en kelvins ?", a: "10 K." },
                { q: "Différence de température Δt = 10 °C – combien cela fait-il en degrés Fahrenheit ?", a: "18 °F." },
                { q: "Différence de température Δt = 18 °F – combien cela fait-il en degrés Celsius ?", a: "10 °C." },
                { q: "Différence de température ΔT = 100 K – combien cela fait-il en degrés Celsius ?", a: "100 °C." },
                { q: "Différence de température Δt = 36 °F – combien cela fait-il en kelvins ?", a: "20 K." },
                { q: "De l'eau chauffée de t₁ = 10 °C à t₂ = 100 °F – quelle est l'augmentation de température en kelvins (environ) ?", a: "Environ 27,8 K." }
            ]
        };

        // ========== KÓD FLASHCARD ==========
        let currentLang = 'cs';
        let currentIndex = 0;
        let order = [];

        const card = document.getElementById('card');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const counter = document.getElementById('counter');
        const nextBtn = document.getElementById('next');
        const prevBtn = document.getElementById('prev');
        const btnCs = document.getElementById('lang-cs');
        const btnFr = document.getElementById('lang-fr');
        const shuffleBtn = document.getElementById('shuffle');

        function generateOrder() {
            let arr = Array.from({length: 50}, (_, i) => i);
            let curr = arr.length, rand;
            while (curr != 0) {
                rand = Math.floor(Math.random() * curr);
                curr--;
                [arr[curr], arr[rand]] = [arr[rand], arr[curr]];
            }
            order = arr;
            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            card.classList.remove('card-flipped');
            const originalIndex = order[currentIndex];
            const data = rawData[currentLang][originalIndex];
            qText.textContent = data.q;
            aText.textContent = data.a;
            counter.textContent = `${currentLang === 'cs' ? 'Karta' : 'Carte'}: ${currentIndex + 1} / 50`;
            prevBtn.disabled = currentIndex === 0;
        }

        card.addEventListener('click', () => {
            card.classList.toggle('card-flipped');
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % 50;
            updateCard();
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        btnCs.addEventListener('click', () => {
            currentLang = 'cs';
            btnCs.classList.add('border-orange-600', 'text-orange-600');
            btnFr.classList.remove('border-orange-600', 'text-orange-600');
            btnFr.classList.add('border-transparent', 'text-slate-600');
            updateCard();
        });

        btnFr.addEventListener('click', () => {
            currentLang = 'fr';
            btnFr.classList.add('border-orange-600', 'text-orange-600');
            btnCs.classList.remove('border-orange-600', 'text-orange-600');
            btnCs.classList.add('border-transparent', 'text-slate-600');
            updateCard();
        });

        shuffleBtn.addEventListener('click', generateOrder);

        generateOrder();
    </script>

</body>
</html>
