<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards: Kinetická teorie látek / Théorie cinétique de la matière</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <style>
        .perspective { perspective: 1000px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
        }
        .card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-blue-700 text-white p-6 shadow-md text-center">
        <h1 class="text-2xl font-bold">Flashcards: Kinetická teorie látek / Théorie cinétique de la matière</h1>
        <p class="text-blue-100 text-sm mt-1">Interaktivní porovnávání jazyků (synchronizované pořadí)</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">

        <div class="flex gap-4 mb-8">
            <button id="lang-cs" class="px-4 py-2 bg-white rounded-full shadow-sm border-2 border-blue-600 text-blue-600 font-bold hover:bg-blue-50 transition-colors">Čeština</button>
            <button id="lang-fr" class="px-4 py-2 bg-white rounded-full shadow-sm border-2 border-transparent text-slate-600 hover:bg-slate-50 transition-colors">Français</button>
        </div>

        <div class="w-full max-w-md aspect-[4/3] perspective">
            <div id="card" class="card-inner h-full shadow-xl">
                <div class="card-face card-front bg-white border-4 border-blue-500 text-xl font-semibold text-slate-800">
                    <p id="question-text">Co jsou tři základní poznatky kinetické teorie látek?</p>
                </div>
                <div class="card-face card-back bg-blue-50 border-4 border-emerald-500 text-lg text-slate-700">
                    <p id="answer-text">Částicová stavba, neuspořádaný pohyb, vzájemné síly.</p>
                </div>
            </div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-4">
            <div class="flex gap-4">
                <button id="prev" class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 disabled:opacity-30" disabled="">← Předchozí</button>
                <button id="next" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500 font-bold">Další →</button>
            </div>
            <p id="counter" class="text-slate-500 font-mono text-sm">Karta: 1 / 50</p>
            <button id="shuffle" class="text-blue-600 text-sm hover:underline mt-2">Nové zamíchání (reset)</button>
        </div>

    </main>

    <footer class="p-6 text-center text-slate-400 text-xs">
        © Guide d'étude interactif - Fyzika / Physique
    </footer>

    <script>
        // ========== DATA ==========
        const rawData = {
            cs: [
                { q: "Co jsou tři základní poznatky kinetické teorie látek?", a: "Částicová stavba, neuspořádaný pohyb, vzájemné síly." },
                { q: "Pojem: Co jsou částice látky?", a: "Atomy, molekuly, ionty, subatomární částice." },
                { q: "Je struktura látek spojitá, nebo nespojitá (diskrétní)?", a: "Nespojitá (diskrétní) – objem není vyplněn beze zbytku." },
                { q: "Z čeho je tvořen atom vodíku?", a: "Z jednoho protonu a jednoho elektronu." },
                { q: "Co vznikne ztrátou elektronu z atomu?", a: "Kationt (kladně nabitý iont)." },
                { q: "Co vznikne ziskem elektronu?", a: "Aniont (záporně nabitý iont)." },
                { q: "Lze částice pozorovat optickým mikroskopem?", a: "Ne, jsou příliš malé; lze je zobrazit jen pomocí STM." },
                { q: "Zkratka STM znamená...?", a: "Řádkovací tunelový mikroskop (scanning tunneling microscope)." },
                { q: "Na jakém jevu STM funguje?", a: "Na kvantovém tunelovém jevu." },
                { q: "Jaký je řádový rozměr atomu?", a: "Přibližně 10⁻¹⁰ m (1 ångström)." },
                { q: "Jaký je řádový rozměr atomového jádra?", a: "Přibližně 10⁻¹⁵ m (1 femtometr)." },
                { q: "Kolikrát je jádro menší než atom?", a: "Přibližně stotisíckrát (10⁵×)." },
                { q: "Co je Brownův pohyb?", a: "Neuspořádaný mikroskopický pohyb nepatrných částic v kapalině." },
                { q: "Kdo objevil Brownův pohyb a kdy?", a: "Robert Brown, v roce 1827." },
                { q: "Jakou profesi a národnost měl Robert Brown?", a: "Byl to skotský botanik." },
                { q: "Čím se vysvětluje Brownův pohyb?", a: "Srážkami pozorované částice s molekulami kapaliny." },
                { q: "Co je difúze?", a: "Samovolné pronikání částic jedné látky mezi částice látky druhé." },
                { q: "Za jaké podmínky difúze probíhá?", a: "Jsou-li látky ve vzájemném kontaktu." },
                { q: "Ve kterém skupenství probíhá difúze nejrychleji?", a: "V plynech." },
                { q: "Ve kterém skupenství probíhá difúze nejpomaleji?", a: "V pevných látkách." },
                { q: "Jak ovlivňuje teplota rychlost difúze?", a: "Při vyšší teplotě je difúze rychlejší." },
                { q: "Čím je způsoben tlak plynu?", a: "Srážkami molekul plynu v tepelném pohybu se stěnami nádoby." },
                { q: "Z čeho vyplývá interakce mezi dvěma atomy?", a: "Z přitažlivých a odpudivých sil mezi jádry a elektronovými obaly." },
                { q: "Jaký náboj mají jádra atomů?", a: "Kladný." },
                { q: "Jaký náboj mají elektronové obaly?", a: "Záporný." },
                { q: "Jaká síla převažuje při malé vzdálenosti částic?", a: "Odpudivá síla." },
                { q: "Jaká síla převažuje při větší vzdálenosti částic?", a: "Přitažlivá síla." },
                { q: "Jaká je síla mezi částicemi pro velmi velké vzdálenosti?", a: "Prakticky nulová." },
                { q: "Co je koheze?", a: "Přitažlivá síla mezi částicemi jednoho tělesa." },
                { q: "Co je adheze?", a: "Přitažlivá síla mezi dvěma tělesy v kontaktu." },
                { q: "Jak se projevují odpudivé síly mezi molekulami?", a: "Malou stlačitelností kapalin a pevných látek." },
                { q: "Co dalšího dokazuje existenci odpudivých sil?", a: "Změna směru pohybu při srážce dvou těles." },
                { q: "Jak se nazývá poloha, kde je výsledná síla mezi částicemi nulová?", a: "Rovnovážná poloha." },
                { q: "Jak se nazývají síly mezi atomy v molekule?", a: "Vazebné síly." },
                { q: "Co určují vazebné síly?", a: "Strukturu molekuly." },
                { q: "Co je vazebná energie?", a: "Práce potřebná k přerušení vazby vnějšími silami." },
                { q: "Jaký je poměr Ep a Ek u plynné látky?", a: "Ep ≪ Ek (potenciální energie mnohem menší než kinetická)." },
                { q: "Proč je u plynu Ep malá?", a: "Protože vzdálenosti částic jsou mnohem větší než jejich rozměry a přitažlivé síly jsou zanedbatelné." },
                { q: "Jaký je poměr Ep a Ek u pevné látky?", a: "Ep ≫ Ek (potenciální energie mnohem větší než kinetická)." },
                { q: "Jaké jsou střední vzdálenosti částic v pevné látce?", a: "0,2–0,3 nm." },
                { q: "Jaký je rozdíl mezi krystalickou a amorfní pevnou látkou?", a: "Krystalická má pravidelnou vnitřní strukturu, amorfní nepravidelnou." },
                { q: "Jaký je poměr Ep a Ek u kapaliny?", a: "Ep ≈ Ek (srovnatelné)." },
                { q: "Proč se u kapaliny rovnovážné polohy částic mění v čase?", a: "Protože síly mezi částicemi jsou slabé." },
                { q: "Co je plazma?", a: "„Čtvrté skupenství látky“ – soustava nabitých a neutrálních částic." },
                { q: "Uveďte příklad plazmatu.", a: "Plamen, blesk, elektrický výboj, hvězdy." },
                { q: "Co je termodynamická soustava?", a: "Soubor těles, jejichž stav zkoumáme." },
                { q: "Co jsou stavové veličiny?", a: "Fyzikální veličiny popisující stav soustavy (teplota, objem, tlak…)." },
                { q: "Co je rovnovážný stav?", a: "Stav soustavy, který zůstává v čase neměnný." },
                { q: "Co se stane se soustavou v neměnných vnějších podmínkách?", a: "Samovolně přejde do rovnovážného stavu." },
                { q: "Kolikrát je 1 Å větší než 1 fm?", a: "100 000krát (1 Å = 100 000 fm)." }
            ],
            fr: [
                { q: "Quels sont les trois postulats fondamentaux de la théorie cinétique ?", a: "Structure particulaire, mouvement désordonné, forces mutuelles." },
                { q: "Concept : Que sont les particules d'une substance ?", a: "Atomes, molécules, ions, particules subatomiques." },
                { q: "La structure des substances est-elle continue ou discrète ?", a: "Discrète – le volume n'est pas entièrement occupé par la matière." },
                { q: "De quoi est constitué l'atome d'hydrogène ?", a: "D'un proton et d'un électron." },
                { q: "Que forme la perte d'un électron par un atome ?", a: "Un cation (ion chargé positivement)." },
                { q: "Que forme le gain d'un électron ?", a: "Un anion (ion chargé négativement)." },
                { q: "Peut-on observer les particules au microscope optique ?", a: "Non, elles sont trop petites ; seul un STM permet de les visualiser." },
                { q: "Que signifie l'abréviation STM ?", a: "Microscope à effet tunnel (scanning tunneling microscope)." },
                { q: "Sur quel phénomène repose le STM ?", a: "Sur l'effet tunnel quantique." },
                { q: "Quel est l'ordre de grandeur d'un atome ?", a: "Environ 10⁻¹⁰ m (1 ångström)." },
                { q: "Quel est l'ordre de grandeur du noyau atomique ?", a: "Environ 10⁻¹⁵ m (1 femtomètre)." },
                { q: "Combien de fois le noyau est-il plus petit que l'atome ?", a: "Environ cent mille fois (10⁵×)." },
                { q: "Qu'est-ce que le mouvement brownien ?", a: "Le mouvement microscopique désordonné de minuscules particules dans un liquide." },
                { q: "Qui a découvert le mouvement brownien et quand ?", a: "Robert Brown, en 1827." },
                { q: "Quelle était la profession et la nationalité de Robert Brown ?", a: "C'était un botaniste écossais." },
                { q: "Comment explique-t-on le mouvement brownien ?", a: "Par les chocs entre la particule observée et les molécules du liquide." },
                { q: "Qu'est-ce que la diffusion ?", a: "La pénétration spontanée des particules d'une substance entre les particules d'une autre." },
                { q: "Sous quelle condition la diffusion a-t-elle lieu ?", a: "Lorsque les substances sont en contact." },
                { q: "Dans quel état la diffusion est-elle la plus rapide ?", a: "Dans les gaz." },
                { q: "Dans quel état la diffusion est-elle la plus lente ?", a: "Dans les solides." },
                { q: "Comment la température influence-t-elle la diffusion ?", a: "Une température plus élevée accélère la diffusion." },
                { q: "Qu'est-ce qui cause la pression d'un gaz ?", a: "Les chocs des molécules en agitation thermique contre les parois du récipient." },
                { q: "D'où résulte l'interaction entre deux atomes ?", a: "Des forces attractives et répulsives entre les noyaux et les nuages électroniques." },
                { q: "Quelle est la charge des noyaux atomiques ?", a: "Positive." },
                { q: "Quelle est la charge des nuages électroniques ?", a: "Négative." },
                { q: "Quelle force domine à faible distance entre particules ?", a: "La force répulsive." },
                { q: "Quelle force domine à plus grande distance ?", a: "La force attractive." },
                { q: "Quelle est la force entre particules aux très grandes distances ?", a: "Pratiquement nulle." },
                { q: "Qu'est-ce que la cohésion ?", a: "La force attractive entre les particules d'un même corps." },
                { q: "Qu'est-ce que l'adhésion ?", a: "La force attractive entre deux corps en contact." },
                { q: "Comment se manifestent les forces répulsives entre molécules ?", a: "Par la faible compressibilité des liquides et des solides." },
                { q: "Quelle autre preuve montre l'existence des forces répulsives ?", a: "Le changement de direction du mouvement lors d'un choc entre deux corps." },
                { q: "Comment nomme-t-on la position où la force résultante entre particules est nulle ?", a: "La position d'équilibre." },
                { q: "Comment appelle-t-on les forces entre les atomes d'une molécule ?", a: "Forces de liaison." },
                { q: "Que déterminent les forces de liaison ?", a: "La structure de la molécule." },
                { q: "Qu'est-ce que l'énergie de liaison ?", a: "Le travail nécessaire pour rompre une liaison par des forces extérieures." },
                { q: "Quel est le rapport Ep/Ek pour une substance gazeuse ?", a: "Ep ≪ Ek (l'énergie potentielle est bien plus faible que la cinétique)." },
                { q: "Pourquoi Ep est-elle faible dans un gaz ?", a: "Car les distances entre particules sont bien plus grandes que leurs dimensions, rendant les forces attractives négligeables." },
                { q: "Quel est le rapport Ep/Ek pour une substance solide ?", a: "Ep ≫ Ek (l'énergie potentielle est bien plus grande que la cinétique)." },
                { q: "Quelles sont les distances moyennes entre particules dans un solide ?", a: "0,2 à 0,3 nm." },
                { q: "Quelle est la différence entre solide cristallin et amorphe ?", a: "Le cristallin a une structure interne régulière, l'amorphe une structure irrégulière." },
                { q: "Quel est le rapport Ep/Ek pour un liquide ?", a: "Ep ≈ Ek (comparables)." },
                { q: "Pourquoi les positions d'équilibre varient-elles dans le temps pour un liquide ?", a: "Parce que les forces entre particules sont faibles." },
                { q: "Qu'est-ce que le plasma ?", a: "Le « quatrième état de la matière » – un système de particules chargées et neutres." },
                { q: "Donnez un exemple de plasma.", a: "Une flamme, un éclair, une décharge électrique, les étoiles." },
                { q: "Qu'est-ce qu'un système thermodynamique ?", a: "L'ensemble des objets dont on étudie l'état." },
                { q: "Que sont les grandeurs d'état ?", a: "Des grandeurs physiques décrivant l'état du système (température, volume, pression…)." },
                { q: "Qu'est-ce que l'état d'équilibre ?", a: "Un état du système qui demeure constant dans le temps." },
                { q: "Que devient un système placé dans des conditions extérieures invariables ?", a: "Il évolue spontanément vers l'état d'équilibre." },
                { q: "Combien de fois 1 Å est-il plus grand que 1 fm ?", a: "100 000 fois (1 Å = 100 000 fm)." }
            ]
        };

        // ========== KÓD FLASHCARD ==========
        let currentLang = 'cs';
        let currentIndex = 0;
        let order = [];

        const card = document.getElementById('card');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const counter = document.getElementById('counter');
        const nextBtn = document.getElementById('next');
        const prevBtn = document.getElementById('prev');
        const btnCs = document.getElementById('lang-cs');
        const btnFr = document.getElementById('lang-fr');
        const shuffleBtn = document.getElementById('shuffle');

        function generateOrder() {
            let arr = Array.from({length: 50}, (_, i) => i);
            let curr = arr.length, rand;
            while (curr != 0) {
                rand = Math.floor(Math.random() * curr);
                curr--;
                [arr[curr], arr[rand]] = [arr[rand], arr[curr]];
            }
            order = arr;
            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            card.classList.remove('card-flipped');
            const originalIndex = order[currentIndex];
            const data = rawData[currentLang][originalIndex];
            qText.textContent = data.q;
            aText.textContent = data.a;
            counter.textContent = `${currentLang === 'cs' ? 'Karta' : 'Carte'}: ${currentIndex + 1} / 50`;
            prevBtn.disabled = currentIndex === 0;
        }

        card.addEventListener('click', () => {
            card.classList.toggle('card-flipped');
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % 50;
            updateCard();
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        btnCs.addEventListener('click', () => {
            currentLang = 'cs';
            btnCs.classList.add('border-blue-600', 'text-blue-600');
            btnFr.classList.remove('border-blue-600', 'text-blue-600');
            btnFr.classList.add('border-transparent', 'text-slate-600');
            updateCard();
        });

        btnFr.addEventListener('click', () => {
            currentLang = 'fr';
            btnFr.classList.add('border-blue-600', 'text-blue-600');
            btnCs.classList.remove('border-blue-600', 'text-blue-600');
            btnCs.classList.add('border-transparent', 'text-slate-600');
            updateCard();
        });

        shuffleBtn.addEventListener('click', generateOrder);

        generateOrder();
    </script>

</body>
</html>
