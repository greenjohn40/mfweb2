<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards: Deformace pevných těles</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');
        body { font-family: 'Noto Sans', sans-serif; background-color: #f3f4f6; }
        .card-container { perspective: 1000px; height: 350px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-front { background-color: white; border: 2px solid #3b82f6; }
        .card-back { background-color: #3b82f6; color: white; transform: rotateY(180deg); }
        .active-lang { text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- Header & Controls -->
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-gray-800" id="title">Flashcards: Deformace</h1>
                <p class="text-sm text-gray-500" id="counter">Karta 1 z 30</p>
            </div>
            <div class="flex gap-3 text-sm">
                <button id="btn-cz" onclick="setLang('cz')" class="active-lang">CZ</button>
                <span class="text-gray-300">|</span>
                <button id="btn-fr" onclick="setLang('fr')">FR</button>
            </div>
        </header>

        <!-- Card -->
        <div class="card-container mb-8" onclick="flipCard()">
            <div class="card-inner" id="card-inner">
                <div class="card-front">
                    <div id="card-question" class="text-lg md:text-xl font-semibold">Co je to deformace?</div>
                </div>
                <div class="card-back">
                    <div id="card-answer" class="text-lg md:text-xl">Změna vzájemné polohy částic tělesa vlivem vnějších sil.</div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="flex justify-between items-center gap-4">
            <button onclick="prevCard()" class="bg-gray-200 hover:bg-gray-300 px-6 py-2 rounded-lg transition" id="btn-prev">Předchozí</button>
            <button onclick="shuffleCards()" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 px-4 py-2 rounded-lg text-sm" id="btn-shuffle">Zamíchat</button>
            <button onclick="nextCard()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition" id="btn-next">Další</button>
        </div>

        <div class="mt-12 p-4 bg-blue-50 rounded-lg text-sm text-blue-800">
            <p id="instruction">Tip: Klikněte na kartu pro otočení a zobrazení odpovědi.</p>
        </div>
    </div>

    <script>
        const cards = [
            // PODSTATA (Sekce 1 v příručce)
            { cz: ["Co je to deformace?", "Změna vzájemné polohy částic tělesa vlivem vnějších sil."], fr: ["Qu'est-ce que la déformation ?", "Changement de la position relative des particules d'un corps sous l'influence de forces externes."] },
            { cz: ["Definuj pružnou (elastickou) deformaci.", "Dočasná změna tvaru; po odstranění sil se těleso vrátí do původního stavu."], fr: ["Définissez la déformation élastique.", "Changement temporaire de forme ; après suppression des forces, le corps reprend sa forme initiale."] },
            { cz: ["Definuj tvárnou (plastickou) deformaci.", "Trvalá změna tvaru; změny v tělese zůstanou i po odstranění sil."], fr: ["Définissez la déformation plastique.", "Changement permanent de forme ; les changements subsistent même après suppression des forces."] },

            // DRUHY DEFORMACE (Sekce 1 - tabulka)
            { cz: ["Vyjmenuj 5 základních druhů deformace.", "Tah, Tlak, Ohyb, Smyk, Kroucení."], fr: ["Nommez les 5 types fondamentaux de déformation.", "Traction, Compression, Flexion, Cisaillement, Torsion."] },
            { cz: ["Jak působí síly při deformaci tahem?", "Dvě stejně velké síly působí v ose tělesa směrem od sebe."], fr: ["Comment agissent les forces lors d'une traction ?", "Deux forces égales agissent dans l'axe du corps en s'éloignant l'une de l'autre."] },
            { cz: ["Jak působí síly při deformaci tlakem?", "Dvě stejně velké síly působící v ose tělesa směrem k sobě."], fr: ["Comment agissent les forces lors d'une compression ?", "Deux forces égales agissant dans l'axe l'une vers l'autre."] },
            { cz: ["Charakterizuj deformaci ohybem.", "Síly působí kolmo na podélnou osu tělesa."], fr: ["Caractérisez la déformation par flexion.", "Les forces agissent perpendiculairement à l'axe longitudinal du corps."] },
            { cz: ["Kde se v praxi setkáme s deformací smykem?", "U nýtů, šroubových spojů nebo při stříhání materiálu."], fr: ["Où rencontre-t-on le cisaillement en pratique ?", "Dans les rivets, les boulons ou lors de la découpe de matériaux."] },
            { cz: ["Uveď příklad deformace kroucením (torze).", "Hřídel motoru, vrták nebo klíč v zámku."], fr: ["Donnez un exemple de déformation par torsion.", "Arbre moteur, foret ou clé dans une serrure."] },

            // VELIČINY A VZORCE (Sekce 2)
            { cz: ["Napiš vzorec pro normálové napětí.", "$$\\sigma = \\frac{F_p}{S}$$"], fr: ["Écrivez la formule de la contrainte normale.", "$$\\sigma = \\frac{F_p}{S}$$"] },
            { cz: ["V jakých jednotkách vyjadřujeme napětí $\\sigma$?", "V Pascalech [Pa] nebo Newtonech na metr čtvereční [N/m²]."], fr: ["Dans quelles unités exprime-t-on la contrainte $\\sigma$ ?", "En Pascals [Pa] ou Newtons par mètre carré [N/m²]."] },
            { cz: ["Napiš vzorec pro relativní prodloužení $\\varepsilon$.", "$$\\varepsilon = \\frac{\\Delta l}{l_0}$$"], fr: ["Écrivez la formule de l'allongement relatif $\\varepsilon$.", "$$\\varepsilon = \\frac{\\Delta l}{l_0}$$"] },
            { cz: ["Vysvětli význam veličiny $\\varepsilon$.", "Bezrozměrná veličina udávající poměrnou (procentuální) změnu délky."], fr: ["Expliquez la signification de $\\varepsilon$.", "Grandeur sans dimension indiquant le changement relatif (proportionnel) de longueur."] },
            { cz: ["Vyslov Hookův zákon pro pružnou deformaci.", "Normálové napětí $\\sigma$ je přímo úměrné relativnímu prodloužení $\\varepsilon$."], fr: ["Énoncez la loi de Hooke.", "La contrainte normale $\\sigma$ est directement proportionnelle à l'allongement relatif $\\varepsilon$."] },
            { cz: ["Napiš matematický vztah Hookova zákona.", "$$\\sigma = E \\cdot \\varepsilon$$"], fr: ["Écrivez la relation mathématique de la loi de Hooke.", "$$\\sigma = E \\cdot \\varepsilon$$"] },
            { cz: ["Co je to modul pružnosti $E$?", "Veličina udávající tuhost materiálu (Youngův modul)."], fr: ["Qu'est-ce que le module d'élasticité $E$ ?", "Grandeur indiquant la rigidité du matériau (module de Young)."] },

            // DEFORMAČNÍ KŘIVKA (Sekce 3)
            { cz: ["Co představuje deformační křivka?", "Vztah mezi normálovým napětím $\\sigma$ a relativním prodloužením $\\varepsilon$."], fr: ["Que représente la courbe de déformation ?", "La relation entre la contrainte normale $\\sigma$ et l'allongement relatif $\\varepsilon$."] },
            { cz: ["Definuj mez pružnosti $\\sigma_E$.", "Maximální napětí, po kterém je deformace stále ještě pružná."], fr: ["Définissez la limite d'élasticité $\\sigma_E$.", "La contrainte maximale pour laquelle la déformation reste élastique."] },
            { cz: ["Definuj mez pevnosti $\\sigma_P$.", "Největší napětí, které materiál snese před porušením (přetržením)."], fr: ["Définissez la limite de rupture $\\sigma_P$.", "La contrainte maximale supportée avant la rupture (cassure)."] },
            { cz: ["Co je to dovolené napětí $\\sigma_d$?", "Bezpečné napětí v konstrukci, které zahrnuje bezpečnostní rezervu."], fr: ["Qu'est-ce que la contrainte admissible $\\sigma_d$ ?", "La contrainte de sécurité dans une structure incluant une marge de sécurité."] },

            // PRAKTICKÉ VÝPOČTY (Sekce 4 + aplikace vzorců)
            { cz: ["Vypočítej napětí $\\sigma$, je-li $F = 100$ N a $S = 2$ mm².", "$$\\sigma = \\frac{100}{2 \\cdot 10^{-6}} = 50 \\text{ MPa}$$"], fr: ["Calculez la contrainte $\\sigma$ si $F = 100$ N et $S = 2$ mm².", "$$\\sigma = \\frac{100}{2 \\cdot 10^{-6}} = 50 \\text{ MPa}$$"] },
            { cz: ["Vypočítej $\\varepsilon$, je-li $l_0 = 2$ m a $\\Delta l = 2$ mm.", "$$\\varepsilon = \\frac{0,002}{2} = 0,001$$"], fr: ["Calculez $\\varepsilon$ si $l_0 = 2$ m et $\\Delta l = 2$ mm.", "$$\\varepsilon = \\frac{0,002}{2} = 0,001$$"] },
            { cz: ["Vypočítej sílu $F$, je-li $\\sigma = 200$ MPa a $S = 0,5$ cm².", "$$F = \\sigma \\cdot S = 200 \\cdot 10^6 \\cdot 0,5 \\cdot 10^{-4} = 10 \\, 000 \\text{ N}$$"], fr: ["Calculez la force $F$ si $\\sigma = 200$ MPa et $S = 0,5$ cm².", "$$F = \\sigma \\cdot S = 200 \\cdot 10^6 \\cdot 0,5 \\cdot 10^{-4} = 10 \\, 000 \\text{ N}$$"] },
            { cz: ["Jaká je přibližná hodnota modulu pružnosti oceli?", "$$E \\approx 210 \\text{ GPa}$$"], fr: ["Quelle est la valeur approximative du module d'élasticité de l'acier ?", "$$E \\approx 210 \\text{ GPa}$$"] },
            { cz: ["Jaká je přibližná hodnota modulu pružnosti hliníku?", "$$E \\approx 70 \\text{ GPa}$$"], fr: ["Quelle est la valeur approximative du module d'élasticité de l'aluminium ?", "$$E \\approx 70 \\text{ GPa}$$"] },

            // TERMINOLOGIE (Překlady z příručky)
            { cz: ["Přelož do FR: Tah", "Traction"], fr: ["Traduisez en CZ : Traction", "Tah"] },
            { cz: ["Přelož do FR: Tlak", "Compression"], fr: ["Traduisez en CZ : Compression", "Tlak"] },
            { cz: ["Přelož do FR: Ohyb", "Flexion"], fr: ["Traduisez en CZ : Flexion", "Ohyb"] },
            { cz: ["Přelož do FR: Smyk", "Cisaillement"], fr: ["Traduisez en CZ : Cisaillement", "Smyk"] },
            { cz: ["Přelož do FR: Kroucení", "Torsion"], fr: ["Traduisez en CZ : Torsion", "Kroucení"] }
        ];

        let currentIndex = 0;
        let currentLang = 'cz';
        let isFlipped = false;

        const translations = {
            cz: { title: "Flashcards: Deformace", counter: "Karta", shuffle: "Zamíchat", prev: "Předchozí", next: "Další", instruction: "Tip: Klikněte na kartu pro otočení a zobrazení odpovědi." },
            fr: { title: "Flashcards: Déformation", counter: "Carte", shuffle: "Mélanger", prev: "Précédent", next: "Suivant", instruction: "Astuce : Cliquez sur la carte pour la retourner et voir la réponse." }
        };

        function updateCard() {
            const cardInner = document.getElementById('card-inner');
            cardInner.classList.remove('is-flipped');
            isFlipped = false;

            const cardData = cards[currentIndex][currentLang];
            document.getElementById('card-question').innerHTML = cardData[0];
            document.getElementById('card-answer').innerHTML = cardData[1];

            const trans = translations[currentLang];
            document.getElementById('title').innerText = trans.title;
            document.getElementById('counter').innerText = `${trans.counter} ${currentIndex + 1} z ${cards.length}`;
            document.getElementById('btn-shuffle').innerText = trans.shuffle;
            document.getElementById('btn-prev').innerText = trans.prev;
            document.getElementById('btn-next').innerText = trans.next;
            document.getElementById('instruction').innerText = trans.instruction;

            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        function flipCard() {
            const cardInner = document.getElementById('card-inner');
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardInner.classList.add('is-flipped');
            } else {
                cardInner.classList.remove('is-flipped');
            }
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateCard();
        }

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-cz').className = lang === 'cz' ? 'active-lang' : '';
            document.getElementById('btn-fr').className = lang === 'fr' ? 'active-lang' : '';
            updateCard();
        }

        window.onload = updateCard;
    </script>

</body>
</html>
